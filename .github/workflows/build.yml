name: Build Plugin

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        emby_core:
          - "4.8.0.80"
          - "4.9.1.90"
          - "4.10.0.1-beta"

    name: Emby Core ${{ matrix.emby_core }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate embedded JavaScript
        shell: pwsh
        run: |
          $scripts = Get-ChildItem StrmAssistant/Web/Resources -Filter *.js -File
          if (-not $scripts) { throw "No embedded JavaScript resources were found." }
          foreach ($script in $scripts) {
            Write-Host "Checking $($script.FullName)"
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install ILRepack
        shell: pwsh
        run: dotnet tool install -g dotnet-ilrepack --version 2.0.44

      - name: Restore, build and package
        shell: pwsh
        run: |
          dotnet msbuild StrmAssistant/StrmAssistant.csproj `
            -restore `
            -t:PackagePlugin `
            -p:Configuration=Release `
            -p:EmbyServerCoreVersion=${{ matrix.emby_core }} `
            -p:PluginOutputDir="${{ github.workspace }}\artifacts\${{ matrix.emby_core }}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrmAssistantCustom-emby-${{ matrix.emby_core }}
          path: artifacts/${{ matrix.emby_core }}/StrmAssistantCustom.dll
          if-no-files-found: error
